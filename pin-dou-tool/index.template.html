<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="图片转拼豆图纸工具：一键生成带色号的拼豆图纸和颜色统计表，支持 Mard 221/291 色卡，可自定义尺寸。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>拼豆图纸生成器</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
  --brand:#2563eb; --brand-dark:#1d4ed8; --brand-soft:#dbeafe; --ok:#16a34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top));
  font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;
}
header .badge{margin-left:auto;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);
  padding:3px 10px;border-radius:999px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tip{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.field{margin:10px 0}
.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:10px}
.row .field{flex:1}
input[type=number],select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff;color:var(--text);outline:none;
}
input[type=number]:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
button{
  font-size:15px;border:1px solid var(--line);background:#fff;color:var(--text);
  padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit;
}
button:active{transform:scale(.98)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;width:100%}
button.ghost{background:var(--brand-soft);border-color:transparent;color:var(--brand-dark);font-weight:600}
button.small{padding:6px 10px;font-size:13px}
.seg{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:9px;font-size:14px;color:var(--muted)}
.seg button.active{background:#fff;color:var(--brand-dark);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin:10px 0;color:var(--text)}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
#uploadZone{
  border:2px dashed #c7d2fe;border-radius:12px;background:#f8faff;text-align:center;
  padding:26px 16px;cursor:pointer;transition:background .2s;
}
#uploadZone.drag{background:#dbeafe}
#uploadZone .big{font-size:34px}
#uploadZone .main{font-size:15px;font-weight:600;margin-top:4px}
#uploadZone .sub{font-size:12px;color:var(--muted);margin-top:4px}
#fileInput{display:none}
#imgInfo{font-size:12px;color:var(--muted);margin-top:8px;display:none;align-items:center;gap:8px}
#imgInfo img{height:44px;width:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#imgInfo .x{margin-left:auto;border:none;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:6px 10px}
#canvasWrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;
  background:repeating-conic-gradient(#f5f5f5 0 25%,#fff 0 50%) 0 0/14px 14px;max-height:80vh}
#prevCanvas{display:block}
#busy{display:none;margin:10px 0;font-size:13px;color:var(--brand-dark);font-weight:600}
#busy .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--brand-soft);
  border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:#fff}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.sw{width:20px;height:20px;border-radius:5px;display:inline-block;border:1px solid rgba(0,0,0,.12);vertical-align:-5px;margin-right:8px}
table .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
#tableWrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
#statsMeta{font-size:12px;color:var(--muted);margin:8px 0}
.bar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 12px 30px}
.dim{font-size:12px;color:var(--muted);font-weight:400}
.hidden{display:none!important}
#warn{display:none;background:#fef3c7;border:1px solid #fde68a;color:#92400e;
  border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<header>
  <span class="title-wrap">🧩 拼豆图纸生成器<span class="sub">小猫不吃鱼出品</span></span>
  <span class="badge">Mard 221/291 色卡</span>
</header>
<main>
  <section class="card">
    <h2>1. 选择图片</h2>
    <div id="uploadZone">
      <div class="big">🖼️</div>
      <div class="main">点击选择图片</div>
      <div class="sub">支持 JPG / PNG，可从相册或相机选择，也可长按粘贴/拖入图片</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div id="imgInfo"><img id="thumb" alt=""><span id="imgName"></span><button class="x" id="btnClear">移除</button></div>
    <div id="warn"></div>
  </section>

  <section class="card">
    <h2>2. 图纸参数</h2>
    <div class="field">
      <label>色卡（色号来源 pindou.online/colors）</label>
      <div class="seg" id="paletteSeg">
        <button data-p="291" class="active">291 色 · 完整</button>
        <button data-p="221">221 色 · 基础</button>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>宽度（格）</label><input type="number" id="inW" min="5" max="500" step="1" value="100"></div>
      <div class="field"><label>高度（格）</label><input type="number" id="inH" min="5" max="500" step="1" value="100"></div>
    </div>
    <div class="row">
      <div class="field"><label>适应方式</label>
        <select id="selFit">
          <option value="cover">等比裁剪填充</option>
          <option value="contain">等比留白</option>
          <option value="stretch">拉伸填充</option>
        </select>
      </div>
      <div class="field"><label>颜色匹配</label>
        <select id="selDist">
          <option value="lab">Lab 感知距离</option>
          <option value="rgb">RGB 距离</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
      <label class="chk" style="margin:0"><input type="checkbox" id="chkCodes" checked> 格子内标色号</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="chkGrid" checked> 网格线</label>
    </div>
    <div class="field">
      <label>预览缩放 <span class="dim" id="zoomVal">100%</span></label>
      <input type="range" id="zoom" min="50" max="800" step="25" value="100" style="width:100%;accent-color:var(--brand)">
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="btnFit" class="ghost" style="flex:1">按比例算高度</button>
      <button id="btnGen" class="primary" style="flex:2">生成图纸</button>
    </div>
  </section>

  <section class="card" id="resultCard">
    <h2>3. 图纸预览 <span class="tip dim" id="gridInfo"></span></h2>
    <div id="busy"><span class="spin"></span>正在计算颜色映射…</div>
    <div id="canvasWrap"><canvas id="prevCanvas"></canvas></div>
  </section>

  <section class="card" id="statsCard">
    <h2>4. 颜色统计
      <span class="tip">
        <button class="small ghost" id="btnSort">按色号排序</button>
        <button class="small ghost" id="btnCopy">复制文本</button>
        <button class="small ghost" id="btnCSV">下载 CSV</button>
      </span>
    </h2>
    <div id="statsMeta"></div>
    <div id="tableWrap"><table id="statsTable"><thead><tr>
      <th>预览</th><th>色号</th><th>RGB</th><th class="num">数量</th><th class="num">占比</th><th>用量</th>
    </tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card" id="exportCard">
    <h2>5. 导出图纸</h2>
    <div class="row">
      <div class="field"><label>导出格子大小</label>
        <select id="selCell">
          <option value="24">24 px</option>
          <option value="32" selected>32 px</option>
          <option value="40">40 px</option>
          <option value="48">48 px</option>
          <option value="64">64 px</option>
        </select>
      </div>
      <div class="field"><label>&nbsp;</label><button id="btnPNG" class="primary">导出高清 PNG 图纸</button></div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0">导出为 1:1 打印图，每个格子内标有色号，可直接垫在拼豆板下使用。若格子过多，导出尺寸会被自动限制。</p>
  </section>

  <div class="footer">色卡数据：<a href="https://www.pindou.online/colors" style="color:var(--brand-dark)">pindou.online/colors</a> · Mard 221 / 291 标准色 · 图片在本机处理，不上传</div>
</main>

<script>
/*__PALETTE_DATA__*/
(function(){
"use strict";

// ---------- state ----------
const state = {
  kind:'291',           // '221' | '291'
  img:null,             // Image
  width:100, height:100,
  fit:'cover', dist:'lab',
  codes:true, grid:true, zoom:100,
  cell:32,
  gridData:null,        // 2D array [{code,hex}]
  sortByCount:true,
};

// ---------- elements ----------
const $ = id => document.getElementById(id);
const uploadZone=$('uploadZone'), fileInput=$('fileInput'), thumb=$('thumb'),
  imgInfo=$('imgInfo'), imgName=$('imgName'), btnClear=$('btnClear'), warn=$('warn'),
  inW=$('inW'), inH=$('inH'), selFit=$('selFit'), selDist=$('selDist'),
  chkCodes=$('chkCodes'), chkGrid=$('chkGrid'), zoom=$('zoom'), zoomVal=$('zoomVal'),
  btnFit=$('btnFit'), btnGen=$('btnGen'), busy=$('busy'),
  resultCard=$('resultCard'), prevCanvas=$('prevCanvas'), gridInfo=$('gridInfo'),
  statsCard=$('statsCard'), exportCard=$('exportCard'), statsMeta=$('statsMeta'), statsBody=document.querySelector('#statsTable tbody'),
  btnSort=$('btnSort'), btnCopy=$('btnCopy'), btnCSV=$('btnCSV'),
  selCell=$('selCell'), btnPNG=$('btnPNG'), canvasWrap=$('canvasWrap');

// ---------- palette data ----------
const SERIES_221 = new Set('ABCDEFGHM'.split(''));
const seriesOf = code => (code.match(/^[A-Z]+/)||[''])[0];

const PALETTES = {
  '221': MARD_291.filter(([code])=>SERIES_221.has(seriesOf(code))),
  '291': MARD_291,
};
// precompute Lab caches
const PALETTE_LAB = {};
for (const k in PALETTES){
  PALETTE_LAB[k] = PALETTES[k].map(([code,hex])=>{
    const [r,g,b]=hexToRgb(hex);
    return {code, hex, lab:srgbToLab(r,g,b)};
  });
}

// ---------- color utils ----------
function hexToRgb(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function srgbToLab(r0,g0,b0){
  let r=r0/255,g=g0/255,b=b0/255;
  const lin = c => c>0.04045 ? Math.pow((c+0.055)/1.055,2.4) : c/12.92;
  r=lin(r);g=lin(g);b=lin(b);
  const x=(r*0.4124564+g*0.3575761+b*0.1804375)/0.95047;
  const y=(r*0.2126729+g*0.7151522+b*0.0721750)/1.0;
  const z=(r*0.0193339+g*0.1191920+b*0.9503041)/1.08883;
  const f=t => t>0.008856 ? Math.cbrt(t) : (7.787*t+16/116);
  const fx=f(x),fy=f(y),fz=f(z);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function rgbDistance(r,g,b,pl){
  const dr=r-pl.r, dg=g-pl.g, db=b-pl.b;
  return dr*dr+dg*dg+db*db;
}
function labDistance(r,g,b,pl){
  const [L,a,bb]=srgbToLab(r,g,b);
  const dL=L-pl.lab[0], da=a-pl.lab[1], db2=bb-pl.lab[2];
  return dL*dL+da*da+db2*db2;
}
const luma = (r,g,b) => 0.299*r+0.587*g+0.114*b;
const textColor = (r,g,b) => luma(r,g,b) > 150 ? '#111827' : '#ffffff';

// nearest color
function nearestColor(r,g,b){
  const pal = PALETTE_LAB[state.kind];
  let best=null,bestD=Infinity;
  const fn = state.dist==='rgb' ? rgbDistance : labDistance;
  for (let i=0;i<pal.length;i++){
    const d=fn(r,g,b,pal[i]);
    if (d<bestD){bestD=d;best=pal[i];}
  }
  return best;
}

// ---------- grid building ----------
function buildGrid(){
  const gw=state.width, gh=state.height;
  const src=document.createElement('canvas');
  src.width=gw; src.height=gh;
  const ctx=src.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,gw,gh);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  const img=state.img;
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const fit=state.fit;
  if (fit==='stretch'){
    ctx.drawImage(img,0,0,iw,ih,0,0,gw,gh);
  } else if (fit==='cover'){
    const s=Math.max(gw/iw, gh/ih);
    const sw=gw/s, sh=gh/s;
    const sx=(iw-sw)/2, sy=(ih-sh)/2;
    ctx.drawImage(img,sx,sy,sw,sh,0,0,gw,gh);
  } else { // contain
    const s=Math.min(gw/iw, gh/ih);
    const dw=iw*s, dh=ih*s;
    const dx=(gw-dw)/2, dy=(gh-dh)/2;
    ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh);
  }
  const data=ctx.getImageData(0,0,gw,gh).data;

  const grid=new Array(gh);
  for (let y=0;y<gh;y++){
    const row=new Array(gw);
    const off=y*gw*4;
    for (let x=0;x<gw;x++){
      const i=off+x*4;
      row[x]=nearestColor(data[i],data[i+1],data[i+2]);
    }
    grid[y]=row;
  }
  return grid;
}

// async wrapper for responsiveness
function buildGridAsync(cb){
  busy.style.display='block';
  resultCard.style.display='';
  setTimeout(()=>{
    const t0=performance.now();
    try {
      const g=buildGrid();
      state.gridData=g;
      renderStats();
      drawPreview();
      console.log('built in',Math.round(performance.now()-t0),'ms');
    } catch(e){
      console.error(e);
      showWarn('生成失败：'+e.message);
    }
    busy.style.display='none';
    if (cb) cb();
  }, 30);
}

// ---------- preview ----------
function drawPreview(){
  const gw=state.width, gh=state.height;
  const dpr=Math.min(window.devicePixelRatio||1, 3);
  const wrapW=canvasWrap.clientWidth-2;
  let cell=Math.max(1, Math.floor(wrapW/gw));
  cell=Math.max(1, Math.round(cell*state.zoom/100));
  const W=gw*cell, H=gh*cell;
  prevCanvas.width=W*dpr;
  prevCanvas.height=H*dpr;
  prevCanvas.style.width=W+'px';
  prevCanvas.style.height=H+'px';
  const ctx=prevCanvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  drawGrid(ctx,state.gridData,cell,W,H,false);
  gridInfo.textContent=`${gw} × ${gh} 格`;
}

// shared grid painter
function drawGrid(ctx,grid,cell,W,H,exportMode){
  const gw=state.width, gh=state.height;
  const showCodes = state.codes && (exportMode || cell>=8);
  const showLines = state.grid && (exportMode || cell>=8);
  const fontPx = Math.max(3, Math.round(cell*0.36));
  ctx.font = `600 ${fontPx}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for (let y=0;y<gh;y++){
    const row=grid[y];
    for (let x=0;x<gw;x++){
      const c=row[x];
      const px=x*cell, py=y*cell;
      ctx.fillStyle=c.hex;
      ctx.fillRect(px,py,cell,cell);
      if (showCodes){
        const [r,g,b]=hexToRgb(c.hex);
        ctx.fillStyle=textColor(r,g,b);
        ctx.fillText(c.code, px+cell/2, py+cell/2+0.5);
      }
    }
  }
  if (showLines){
    ctx.strokeStyle='rgba(0,0,0,0.18)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for (let x=0;x<=gw;x++){
      const px=x*cell;
      ctx.moveTo(px+0.5,0); ctx.lineTo(px+0.5,H);
    }
    for (let y=0;y<=gh;y++){
      const py=y*cell;
      ctx.moveTo(0,py+0.5); ctx.lineTo(W,py+0.5);
    }
    ctx.stroke();
  }
}

// ---------- stats ----------
function renderStats(){
  const grid=state.gridData;
  const counts={};
  for (const row of grid) for (const c of row){
    counts[c.code]=(counts[c.code]||0)+1;
  }
  let list=Object.keys(counts).map(code=>{
    const hex=countsCodeHex(code);
    return {code, hex, count:counts[code]};
  });
  state.sortByCount
    ? list.sort((a,b)=>b.count-a.count)
    : list.sort((a,b)=>codeKey(a.code)-codeKey(b.code));

  const total=state.width*state.height;
  statsMeta.textContent=`共 ${total} 颗豆子 · 用色 ${list.length} 种${state.kind==='221'?'（221 色基础版）':'（291 色完整版）'}`;
  const rows=list.map(it=>{
    const pct=(it.count/total*100);
    return `<tr>
      <td><span class="sw" style="background:${it.hex}"></span></td>
      <td class="code">${it.code}</td>
      <td>${it.hex}</td>
      <td class="num">${it.count}</td>
      <td class="num">${pct.toFixed(2)}%</td>
      <td style="width:34%"><div class="bar"><i style="width:${Math.max(1,pct)}%"></i></div></td>
    </tr>`;
  }).join('');
  statsBody.innerHTML=rows;
  statsCard.style.display='';
  exportCard.style.display='';
}

function countsCodeHex(code){
  const pal=PALETTES[state.kind];
  for (const p of pal) if (p[0]===code) return p[1];
  return '#cccccc';
}
function codeKey(code){
  const m=code.match(/^([A-Z]+)(\d+)$/);
  return (m?m[2]:'0').padStart(3,'0');
}
const cellTotal = ()=> state.width*state.height;

function statsText(){
  const grid=state.gridData;
  const counts={};
  for (const row of grid) for (const c of row) counts[c.code]=(counts[c.code]||0)+1;
  const total=cellTotal();
  const lines=[`拼豆图纸 ${state.width}×${state.height} 格 · Mard ${state.kind} 色卡 · 共 ${total} 颗`, ''];
  const list=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  for (const code of list){
    lines.push(`${code}  ${counts[code]}颗  ${(counts[code]/total*100).toFixed(2)}%  ${countsCodeHex(code)}`);
  }
  return lines.join('\n');
}

// ---------- export ----------
function downloadURL(url,name){
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  downloadURL(url,name);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function exportPNG(){
  if (!state.gridData) return;
  const gw=state.width, gh=state.height;
  const MAX=8000;
  let cell=parseInt(selCell.value,10)||32;
  let W=gw*cell, H=gh*cell;
  if (Math.max(W,H)>MAX){
    const s=MAX/Math.max(W,H);
    cell=Math.max(8,Math.floor(cell*s));
    W=gw*cell; H=gh*cell;
  }
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  drawGrid(ctx,state.gridData,cell,W,H,true);
  const name=`拼豆图纸_${gw}x${gh}_${state.kind}色.png`;
  try {
    cv.toBlob(b=>{ if(b) downloadBlob(b,name); else alert('导出失败'); },'image/png');
  } catch(e){ alert('导出失败：'+e.message); }
}

function exportCSV(){
  const grid=state.gridData;
  const counts={};
  for (const row of grid) for (const c of row) counts[c.code]=(counts[c.code]||0)+1;
  const total=cellTotal();
  const rows=Object.keys(counts).map(code=>{
    const p=PALETTES[state.kind].find(x=>x[0]===code);
    return [code, p?p[1]:'', counts[code], (counts[code]/total*100).toFixed(2)+'%', p?('Mard_'+code):''];
  }).sort((a,b)=>codeKey(a[0])-codeKey(b[0]));
  rows.unshift(['色号','RGB','数量','占比','名称']);
  const csv=rows.map(r=>r.map(v=>/[\s,]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob,`拼豆统计_${state.width}x${state.height}_${state.kind}色.csv`);
}

// ---------- events ----------
function readFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type)){ showWarn('请选择图片文件'); return; }
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    state.img=img;
    imgName.textContent=`${file.name} · ${img.naturalWidth}×${img.naturalHeight}`;
    thumb.src=url;
    imgInfo.style.display='flex';
    buildGridAsync();
  };
  img.onerror=()=>showWarn('图片加载失败');
  img.src=url;
}

uploadZone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>readFile(e.target.files[0]));
btnClear.addEventListener('click',e=>{
  e.stopPropagation();
  state.img=null; state.gridData=null;
  fileInput.value='';
  imgInfo.style.display='none';
  resultCard.style.display='none'; statsCard.style.display='none'; exportCard.style.display='none';
});

['dragover','drop'].forEach(ev=>uploadZone.addEventListener(ev,e=>{
  e.preventDefault();
  uploadZone.classList.toggle('drag',ev==='dragover');
  if (ev==='drop') readFile(e.dataTransfer.files[0]);
}));
document.addEventListener('paste',e=>{
  const items=(e.clipboardData||{}).items||[];
  for (const it of items){
    if (it.type && it.type.indexOf('image')===0){ readFile(it.getAsFile()); break; }
  }
});

function showWarn(msg){
  warn.textContent=msg;
  warn.style.display='block';
  setTimeout(()=>warn.style.display='none',5000);
}

// palette seg
document.querySelectorAll('#paletteSeg button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#paletteSeg button').forEach(b=>b.classList.toggle('active',b===btn));
    state.kind=btn.dataset.p;
    schedule();
  });
});

function syncSettings(){
  state.width=Math.max(5,Math.min(500,parseInt(inW.value,10)||5));
  state.height=Math.max(5,Math.min(500,parseInt(inH.value,10)||5));
  state.fit=selFit.value;
  state.dist=selDist.value;
  state.codes=chkCodes.checked;
  state.grid=chkGrid.checked;
  state.zoom=parseInt(zoom.value,10)||100;
  zoomVal.textContent=state.zoom+'%';
}
function checkLimit(){
  if (state.width*state.height>200000){
    showWarn('格数过多（>20 万格），手机可能卡顿，建议减小尺寸');
  }
}
function schedule(){
  syncSettings();
  if (!state.img) return;
  buildGridAsync();
}
let deb=null;
[inW,inH,selFit,selDist,chkCodes,chkGrid].forEach(el=>el.addEventListener('input',()=>{ syncSettings(); clearTimeout(deb); deb=setTimeout(schedule,300); }));
zoom.addEventListener('input',()=>{ syncSettings(); drawPreview(); });
btnGen.addEventListener('click',()=>{ syncSettings(); checkLimit(); if(!state.img){showWarn('请先选择图片');return;} buildGridAsync(); });
btnFit.addEventListener('click',()=>{
  if(!state.img){showWarn('请先选择图片');return;}
  syncSettings();
  const iw=state.img.naturalWidth, ih=state.img.naturalHeight;
  inH.value=Math.round(state.width*ih/iw);
  schedule();
});

btnSort.addEventListener('click',()=>{ state.sortByCount=!state.sortByCount; btnSort.textContent=state.sortByCount?'按色号排序':'按数量排序'; renderStats(); });
btnCopy.addEventListener('click',()=>{
  const t=statsText();
  const done=()=>showWarn('已复制到剪贴板');
  const fail=()=>{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');done();}catch(e){alert('复制失败，请手动复制');}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fail); } else fail();
});
btnCSV.addEventListener('click',exportCSV);
btnPNG.addEventListener('click',exportPNG);

// fit-to-width height hint on width change
inW.addEventListener('blur',()=>{ syncSettings(); if(state.img) inH.placeholder=''; });

// init
syncSettings();
resultCard.style.display='none';
statsCard.style.display='none';
exportCard.style.display='none';
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
